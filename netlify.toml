[build]
  command = "npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"
  functions = "web/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  VITE_ZDEX_DEFAULT_NET = "pearl"
  ZDEX_DEFAULT_NET = "pearl"

[context.production.environment]
  VITE_ZDEX_DEFAULT_NET = "pearl"
  ZDEX_DEFAULT_NET = "pearl"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
